[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "openapps-catalog"
version = "0.1.0"
description = "Discover and compare open-source software you can run yourself."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "OpenApps contributors" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Topic :: Internet",
]

[project.scripts]
openapps = "openapps.cli:main"

[tool.setuptools.package-data]
openapps = ["catalog.json"]
